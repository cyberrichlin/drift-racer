<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101520">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23101520'/%3E%3Cg%20fill='%23e8e8e8'%3E%3Crect%20x='7'%20y='7'%20width='6'%20height='6'/%3E%3Crect%20x='19'%20y='7'%20width='6'%20height='6'/%3E%3Crect%20x='13'%20y='13'%20width='6'%20height='6'/%3E%3Crect%20x='7'%20y='19'%20width='6'%20height='6'/%3E%3Crect%20x='19'%20y='19'%20width='6'%20height='6'/%3E%3C/g%3E%3C/svg%3E">
<title>极速漂移 · 平面赛车</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;}
#app{position:fixed;top:0;bottom:0;left:0;right:0;overflow:hidden;background:#e9d8a6;}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* ---------- 桌面竖屏约束 ---------- */
@media (min-aspect-ratio: 3/4){
  body{background:radial-gradient(circle at 50% 35%,#232c3d 0%,#080b11 72%);}
  #app{left:50%;right:auto;width:calc(100vh * 0.62);transform:translateX(-50%);
    box-shadow:0 0 0 2px rgba(255,255,255,.07),0 24px 70px rgba(0,0,0,.8);}
}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;}
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;
  display:flex;justify-content:space-between;align-items:flex-start;}
.hleft{display:flex;flex-direction:column;gap:7px;}
.badge{display:flex;align-items:baseline;gap:2px;background:linear-gradient(160deg,#2c3550,#1a2032);
  color:#fff;border-radius:13px;padding:5px 12px 6px;box-shadow:0 3px 10px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.14);}
.badge b{font-size:26px;line-height:1;font-weight:800;letter-spacing:-1px;}
.badge i{font-size:12px;font-style:normal;opacity:.75;font-weight:700;}
.badge.mid b{color:#ffd166;}
.badge.mid i{color:#ffd166;}
.badge.bad b{color:#ff8a80;}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(16,22,34,.62);color:#fff;
  border:1px solid rgba(255,255,255,.13);border-radius:11px;padding:3px 10px;
  font-size:13px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  width:fit-content;line-height:1.35;font-variant-numeric:tabular-nums;}
.pill.small{font-size:11px;opacity:.92;padding:2px 9px;}
.speedbox{display:flex;align-items:baseline;gap:4px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.speedbox b{font-size:40px;font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.5);}
.speedbox span{font-size:12px;font-weight:700;opacity:.85;}
#mmWrap{position:relative;width:96px;height:96px;border-radius:16px;overflow:hidden;
  background:rgba(12,18,28,.55);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#minimap{width:100%;height:100%;display:block;}

/* ---------- 控制 ---------- */
#controls{position:absolute;inset:0;pointer-events:none;z-index:12;}
/* 虚拟摇杆：推杆方向 = 镜头（屏幕）绝对方向 */
.stick{position:absolute;left:17px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);
  width:132px;height:132px;border-radius:50%;pointer-events:auto;touch-action:none;
  clip-path:circle(50% at 50% 50%);
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),rgba(14,19,30,.36) 72%);
  border:2px solid rgba(255,255,255,.22);
  box-shadow:inset 0 0 24px rgba(255,255,255,.06),inset 0 -8px 18px rgba(0,0,0,.22);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
.stick::after{content:'';position:absolute;inset:24px;border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.18);}
.stick-knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
  border-radius:50%;background:radial-gradient(circle at 36% 30%,#8fd4ff,#3d8fd6 66%,#255f96);
  border:2px solid rgba(255,255,255,.55);will-change:transform;
  box-shadow:0 5px 14px rgba(0,0,0,.34),inset 0 -3px 8px rgba(0,0,0,.18);}
.stick.active .stick-knob{background:radial-gradient(circle at 36% 30%,#c9ebff,#5aa6e6 66%,#2f6ea8);}
.ctl-right{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;}
#driftBtn{width:108px;height:108px;border-radius:50%;border:3px solid rgba(255,255,255,.55);
  background:radial-gradient(circle at 34% 28%,#ff9a63,#e8402f 68%,#b81f18);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 8px 22px rgba(190,40,25,.45),inset 0 -4px 10px rgba(0,0,0,.18);
  transition:transform .07s,filter .07s;touch-action:none;}
#driftBtn b{font-size:19px;font-weight:800;letter-spacing:2px;}
#driftBtn span{font-size:10px;opacity:.85;letter-spacing:2px;}
#driftBtn.on{transform:scale(.93);filter:brightness(1.22);}
#driftBtn.drifting{box-shadow:0 0 0 4px rgba(255,210,90,.55),0 8px 22px rgba(190,40,25,.5);}
.mid-ctl{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:12px;pointer-events:auto;z-index:13;}
.mini-btn{width:52px;height:52px;border-radius:50%;background:rgba(14,19,30,.42);color:#fff;border:1.5px solid rgba(255,255,255,.2);
  font-size:19.5px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);touch-action:none;}
.mini-btn.on{background:rgba(90,190,255,.5);}

/* ---------- 覆盖层 ---------- */
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  background:linear-gradient(170deg,#141c2b 0%,#0d121b 55%,#191f2e 100%);overflow:hidden;}
.screen.hide{display:none;}
#countdown.hide{display:none;}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 18px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.logo{text-align:center;margin-bottom:4px;}
.logo h1{font-size:31px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(92deg,#ffd166,#ff7b54 45%,#5ac8fa);-webkit-background-clip:text;
  background-clip:text;color:transparent;line-height:1.15;}
.logo p{font-size:11.5px;color:#8d9bb5;letter-spacing:2.5px;margin-top:6px;}
.sect{font-size:12px;color:#7f8da8;letter-spacing:2px;margin:18px 2px 9px;font-weight:700;}
.tracks{display:flex;flex-direction:column;gap:9px;}
.tcard{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:15px;
  background:linear-gradient(120deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1.5px solid rgba(255,255,255,.09);transition:.14s;cursor:pointer;}
.tcard.sel{border-color:#5ac8fa;background:linear-gradient(120deg,rgba(90,200,250,.2),rgba(90,200,250,.05));
  box-shadow:0 0 0 3px rgba(90,200,250,.12);}
.tnum{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#0d121b;background:linear-gradient(140deg,#ffd166,#ffa94d);}
.tcard.sel .tnum{background:linear-gradient(140deg,#7ee0ff,#3aa6e0);}
.tinfo{flex:1;min-width:0;}
.tname{color:#eef3fb;font-size:15px;font-weight:800;letter-spacing:.5px;}
.tmeta{color:#8b99b4;font-size:11px;margin-top:3px;letter-spacing:.4px;}
.tstars{font-size:11px;color:#ffd166;letter-spacing:1px;white-space:nowrap;}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 4px;}
.optrow>span{color:#c6d1e4;font-size:13.5px;font-weight:700;}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:11px;padding:3px;gap:3px;
  border:1px solid rgba(255,255,255,.08);}
.seg button{border:none;background:transparent;color:#94a3bd;font-size:12.5px;font-weight:700;
  padding:6px 14px;border-radius:8px;transition:.14s;}
.seg button.on{background:#5ac8fa;color:#0b111a;}
.optrow.diffrow{display:block;padding:9px 4px 12px;}
.difftop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.difftop>span{color:#c6d1e4;font-size:13.5px;font-weight:700;}
.difftop>b{color:#ffd166;font-size:12px;font-weight:800;letter-spacing:.4px;}
.diffrow .seg{width:100%;box-sizing:border-box;}
.diffrow .seg button{flex:1;padding:7px 0;font-size:12px;text-align:center;}
.bigbtn{width:100%;margin-top:20px;padding:16px;border:none;border-radius:16px;font-size:17px;font-weight:900;
  letter-spacing:3px;color:#20130a;background:linear-gradient(100deg,#ffd166,#ff9f43);
  box-shadow:0 8px 24px rgba(255,159,67,.3);transition:.12s;}
.bigbtn:active{transform:scale(.975);}
.bigbtn.ghost{background:transparent;color:#a9b7cf;border:1.5px solid rgba(255,255,255,.16);
  box-shadow:none;margin-top:10px;font-size:14px;padding:13px;}
.tips{margin-top:16px;color:#6f7d96;font-size:11.5px;line-height:1.9;text-align:center;}
.tips b{color:#9fb0cc;}
.kbd{display:inline-block;background:rgba(255,255,255,.1);border-radius:5px;padding:0 5px;
  font-size:10.5px;color:#c3cfe3;margin:0 1px;}

/* ---------- 倒计时 / 提示 ---------- */
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:20;pointer-events:none;}
#countdown span{font-size:110px;font-weight:900;color:#fff;letter-spacing:-4px;
  text-shadow:0 6px 30px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.2);
  animation:pop .55s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop{0%{transform:scale(.4);opacity:0}45%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:.92}}
#toast{position:absolute;top:34%;left:50%;transform:translateX(-50%);z-index:22;pointer-events:none;
  color:#fff;font-size:27px;font-weight:900;letter-spacing:4px;opacity:0;transition:opacity .3s;
  text-shadow:0 3px 18px rgba(0,0,0,.7);white-space:nowrap;}

/* ---------- 结算 ---------- */
.reshead{text-align:center;padding:34px 18px 6px;}
.reshead .rk{font-size:64px;font-weight:900;line-height:1;letter-spacing:-3px;
  background:linear-gradient(120deg,#ffd166,#ff8f4d);-webkit-background-clip:text;background-clip:text;color:transparent;}
.reshead .rktxt{color:#93a1ba;font-size:12.5px;letter-spacing:3px;margin-top:8px;}
.reshead .rtt{color:#eaf1fb;font-size:22px;font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums;}
.reslist{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
.row{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:12px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);}
.row.me{background:rgba(90,200,250,.16);border-color:rgba(90,200,250,.42);}
.row .pos{width:22px;text-align:center;color:#8fa0bd;font-weight:900;font-size:13px;}
.row .dot{width:15px;height:15px;border-radius:5px;flex:0 0 15px;border:2px solid rgba(0,0,0,.25);}
.row .nm{flex:1;color:#dfe8f6;font-size:13.5px;font-weight:700;}
.row .tm{color:#9fb0cc;font-size:12.5px;font-variant-numeric:tabular-nums;}
.lapsbox{margin-top:14px;background:rgba(255,255,255,.04);border-radius:13px;padding:12px 14px;
  border:1px solid rgba(255,255,255,.07);}
.lapsbox .lh{color:#8d9bb5;font-size:11px;letter-spacing:2px;margin-bottom:7px;}
.laprow{display:flex;justify-content:space-between;color:#c9d5e7;font-size:13px;padding:3px 0;
  font-variant-numeric:tabular-nums;}
.laprow.best{color:#ffd166;font-weight:800;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- 顶部 HUD -->
  <div id="hud">
    <div class="topbar">
      <div class="hleft">
        <div class="badge" id="rankBadge"><b id="rankNum">5</b><i id="rankSuf">th</i></div>
        <div class="pill">圈 <b id="lapNum" style="margin:0 1px">1</b>/<span id="lapTotal">3</span></div>
        <div class="speedbox"><b id="speedVal">0</b><span>km/h</span></div>
        <div class="pill" style="font-size:15px;padding:4px 11px" id="timeVal">00:00.0</div>
        <div class="pill small" id="lastLap">上圈 --:--.--</div>
      </div>
      <div id="mmWrap"><canvas id="minimap" width="288" height="288"></canvas></div>
    </div>
  </div>

  <!-- 控制 -->
  <div id="controls">
    <div class="stick" id="stick">
      <div class="stick-knob" id="stickKnob"></div>
    </div>
    <div class="ctl-right">
      <button id="driftBtn"><b>漂移</b><span>刹车</span></button>
    </div>
    <div class="mid-ctl">
      <button class="mini-btn" id="pauseBtn">❚❚</button>
      <button class="mini-btn" id="soundBtn">♪</button>
    </div>
  </div>

  <div id="countdown" class="hide"><span>3</span></div>
  <div id="toast"></div>

  <!-- 主菜单 -->
  <div class="screen" id="menu">
    <div class="scroll">
      <div class="logo">
        <h1>极速漂移</h1>
        <p>TOP-DOWN RACING · 平面卡通赛车</p>
      </div>
      <div class="sect">选择赛道</div>
      <div class="tracks" id="trackList"></div>
      <div class="sect">比赛设置</div>
      <div class="optrow">
        <span>赛道边界</span>
        <div class="seg" id="modeSeg">
          <button data-mode="sand" class="on">沙地减速</button>
          <button data-mode="wall">墙壁撞击</button>
        </div>
      </div>
      <div class="optrow">
        <span>比赛圈数</span>
        <div class="seg" id="lapSeg">
          <button data-laps="2">2 圈</button>
          <button data-laps="3" class="on">3 圈</button>
          <button data-laps="5">5 圈</button>
        </div>
      </div>
      <div class="optrow diffrow">
        <div class="difftop">
          <span>电脑难度</span>
          <b id="diffLabel">一星 · 对手车速 100%</b>
        </div>
        <div class="seg" id="diffSeg">
          <button data-diff="1" class="on">1★</button>
          <button data-diff="2">2★</button>
          <button data-diff="3">3★</button>
          <button data-diff="4">4★</button>
          <button data-diff="5">5★</button>
          <button data-diff="6">6★</button>
        </div>
      </div>
      <button class="bigbtn" id="startBtn">开 始 比 赛</button>
      <div class="tips">
        左下<b>摇杆</b>：朝想去的方向拖，车就往那个方向开（按屏幕方向，不看车头朝向）<br>
        右下红色按钮：<b>按住 = 手刹漂移</b>，配合摇杆即可甩尾<br>
        电脑键盘：<span class="kbd">WASD</span>/<span class="kbd">←</span><span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">→</span> 同样是屏幕方向，<span class="kbd">空格</span> 漂移
      </div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="screen hide" id="pause">
    <div class="scroll" style="display:flex;flex-direction:column;justify-content:center">
      <div class="logo"><h1>暂 停</h1><p>PAUSED</p></div>
      <button class="bigbtn" id="resumeBtn">继 续 比 赛</button>
      <button class="bigbtn ghost" id="restartBtn">重 新 开 始</button>
      <button class="bigbtn ghost" id="quitBtn">返 回 主 菜 单</button>
    </div>
  </div>

  <!-- 结算 -->
  <div class="screen hide" id="result">
    <div class="scroll">
      <div class="reshead">
        <div class="rk" id="resRank">1st</div>
        <div class="rktxt" id="resSub">比赛结束</div>
        <div class="rtt" id="resTime">00:00.00</div>
      </div>
      <div class="sect">最终排名</div>
      <div class="reslist" id="resList"></div>
      <div class="lapsbox">
        <div class="lh">单圈成绩</div>
        <div id="lapList"></div>
      </div>
      <button class="bigbtn" id="againBtn">再 跑 一 次</button>
      <button class="bigbtn ghost" id="backBtn">返 回 主 菜 单</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ========================================================================
   极速漂移 · 纯前端平面赛车（单文件 / 无外部依赖）
   ======================================================================== */

/* ---------------- 基础工具 ---------------- */
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function angDiff(a,b){ var d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function fmtTime(t){
  if(t==null||!isFinite(t)) return '--:--.--';
  var m=Math.floor(t/60), s=t-m*60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s.toFixed(2);
}
function fmtShort(t){
  if(t==null||!isFinite(t)) return '--.--';
  return t.toFixed(2);
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function rr(c,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function el(id){ return document.getElementById(id); }

/* ---------------- 车道参数 ---------------- */

    pts:[

      [1363,1278],[1328,1301],[1292,1324],[1257,1346],[1222,1369],[1185,1390],[1146,1405],[1106,1415],[1064,1418],[1022,1416],
      [981,1408],[940,1399],[899,1391],[858,1382],[816,1373],[776,1364],[734,1356],[693,1347],[652,1338],[611,1330],
      [570,1321],[529,1312],[488,1303],[447,1295],[406,1286],[365,1277],[324,1268],[283,1260],[242,1251],[201,1242],
      [160,1234],[119,1225],[78,1216],[36,1207],[-4,1196],[-42,1179],[-78,1156],[-109,1129],[-137,1098],[-160,1062],
      [-177,1024],[-189,984],[-195,943],[-195,901],[-189,859],[-180,818],[-171,777],[-162,736],[-153,695],[-144,654],

/* ---------------- 赛道构建 ---------------- */
function buildTrack(def){
  var i, m=def.pts.length, P=[];
  for(i=0;i<m;i++) P.push([def.pts[i][0], def.pts[i][1]]);
  var S=[], acc=0;
  for(i=0;i<m;i++){
    var aa=P[(i-1+m)%m], bb=P[i], cc=P[(i+1)%m];
    var tx=cc[0]-aa[0], ty=cc[1]-aa[1], L=Math.hypot(tx,ty)||1; tx/=L; ty/=L;
    S.push({x:bb[0], y:bb[1], tx:tx, ty:ty, nx:-ty, ny:tx, s:0, R:1e6});
  }
  for(i=0;i<m;i++){
    var cur=S[i], nx2=S[(i+1)%m];
    cur.s=acc; acc+=Math.hypot(nx2.x-cur.x, nx2.y-cur.y);
  }
  for(i=0;i<m;i++){
    var q1=S[(i-1+m)%m], q2=S[i], q3=S[(i+1)%m];
    var ab=Math.hypot(q2.x-q1.x,q2.y-q1.y), bc=Math.hypot(q3.x-q2.x,q3.y-q2.y), ca=Math.hypot(q1.x-q3.x,q1.y-q3.y);
    var area=Math.abs((q2.x-q1.x)*(q3.y-q1.y)-(q3.x-q1.x)*(q2.y-q1.y))/2;
    q2.R = area<1e-6 ? 1e6 : ab*bc*ca/(4*area);
  }
  var pad=def.hw+34;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(i=0;i<m;i++){
    minx=Math.min(minx,S[i].x-pad); maxx=Math.max(maxx,S[i].x+pad);
    miny=Math.min(miny,S[i].y-pad); maxy=Math.max(maxy,S[i].y+pad);
  }
  var lift=[];
  if(def.lift) for(i=0;i<def.lift.length;i++) lift.push([def.lift[i][0], def.lift[i][1]]);
  return { def:def, name:def.name, diff:def.diff, hw:def.hw, S:S, n:m, len:acc, lift:lift,
           bounds:{minx:minx,miny:miny,maxx:maxx,maxy:maxy} };
}
function sampleAt(tr, s, near){
  var L=tr.len, A=tr.S, N=A.length, i;
  s=((s%L)+L)%L;
  var lo=0;
  if(near!=null && near>=0){
    /* 局部窗口：高架桥上下层重叠处只沿当前所在层取点，避免串层 */
    var w=9, before=-1, bd=1e18, besti=0;
    for(i=-w;i<=w;i++){
      var j=((near+i)%N+N)%N;
      var dd=Math.abs(A[j].s-s); if(dd>L/2) dd=L-dd;
      if(dd<bd){ bd=dd; besti=j; }
      if(A[j].s<=s && (before<0 || A[j].s>A[before].s)) before=j;
    }
    lo = (before>=0)? before : besti;
  }else{
    var hi=N-1;
    while(lo<hi){ var mid=(lo+hi+1)>>1; if(A[mid].s<=s) lo=mid; else hi=mid-1; }
  }
  var a=A[lo], b=A[(lo+1)%N];
  var seg=b.s-a.s; if(seg<0) seg+=L;
  var t=seg>0 ? (s-a.s)/seg : 0;
  if(t<0) t=0; else if(t>1) t=1;
  return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t,
           tx:a.tx, ty:a.ty, nx:a.nx, ny:a.ny, R:a.R, idx:lo };
}
function nearestOnTrack(tr,x,y,near){
  var A=tr.S, m=A.length, i, best=-1, bd=1e18;
  if(near!=null && near>=0){
    /* 局部窗口检索：自交叠（8字高架）处不会吸附到另一层 */
    var w=6;
    for(i=-w;i<=w;i++){
      var j=((near+i)%m+m)%m;
      var dx=A[j].x-x, dy=A[j].y-y, d=dx*dx+dy*dy;
      if(d<bd){ bd=d; best=j; }
    }
    if(bd>430*430) best=-1;   /* 异常情况退回全局检索 */
  }
  if(best<0){
    best=0; bd=1e18;
    for(i=0;i<m;i++){
      var dx2=A[i].x-x, dy2=A[i].y-y, d2=dx2*dx2+dy2*dy2;
      if(d2<bd){ bd=d2; best=i; }
    }
  }
  var a=A[best], b=A[(best+1)%m];
  var ex=b.x-a.x, ey=b.y-a.y, el=ex*ex+ey*ey || 1;
  var t=clamp(((x-a.x)*ex+(y-a.y)*ey)/el, 0, 1);
  var px=a.x+ex*t, py=a.y+ey*t;
  var seg=b.s-a.s; if(seg<0) seg+=tr.len;
  return { idx:best, s:a.s+seg*t, dist:Math.hypot(x-px,y-py),
           px:px, py:py, tx:a.tx, ty:a.ty, nx:a.nx, ny:a.ny };
}
function speedForRadius(R){
  if(!isFinite(R)||R>4000) return MAXSPEED;
  R=Math.max(R,90);
  var v=(0.55*R + Math.sqrt(0.3025*R*R + 1000*R))/2;
  return Math.min(v, MAXSPEED);
}

    }
    if(d > tr.hw+620) continue;
    items.push({x:x,y:y,type: rnd()<0.52?'palm':'bush',
                s:0.72+rnd()*0.6, rot:rnd()*TAU});
  }
  items.sort(function(a,b2){ return a.y-b2.y; });
  return items;
}
function drawPalm(c,x,y,s,rot){
  c.save(); c.translate(x,y); c.rotate(rot); c.scale(s,s);

  c.fillStyle='#6b4223'; c.beginPath(); c.arc(0,0,4.6,0,TAU); c.fill();

}

/* ---------------- 音效 ---------------- */
var Sfx = {
  ac:null, ready:false, on:true, master:null, eng:null, nGain:null, nFlt:null,
  init:function(){
    if(this.ac || !this.on) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value=0; this.master.connect(this.ac.destination);
      var o1=this.ac.createOscillator(); o1.type='sawtooth'; o1.frequency.value=58;
      var o2=this.ac.createOscillator(); o2.type='square';  o2.frequency.value=60;
      this.eng=this.ac.createGain(); this.eng.gain.value=0.085;
      var flt=this.ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=520; flt.Q.value=2.5;
      o1.connect(this.eng); o2.connect(this.eng);
      this.eng.connect(flt); flt.connect(this.master);
      o1.start(); o2.start(); this.o1=o1; this.o2=o2;
      var sr=this.ac.sampleRate, len=Math.floor(sr*1.0);
      var buf=this.ac.createBuffer(1,len,sr), d=buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
      var ns=this.ac.createBufferSource(); ns.buffer=buf; ns.loop=true;
      this.nFlt=this.ac.createBiquadFilter(); this.nFlt.type='bandpass'; this.nFlt.frequency.value=2200; this.nFlt.Q.value=0.9;
      this.nGain=this.ac.createGain(); this.nGain.gain.value=0;
      ns.connect(this.nFlt); this.nFlt.connect(this.nGain); this.nGain.connect(this.master);
      ns.start();
      this.ready=true;
    }catch(e){ this.ready=false; this.on=false; }
  },
  resume:function(){ try{ if(this.ac && this.ac.state==='suspended') this.ac.resume(); }catch(e){} },
  update:function(ratio, drift, sand, active){
    if(!this.ready) return;
    var t=this.ac.currentTime;
    this.master.gain.setTargetAtTime((this.on&&active)?0.5:0, t, 0.1);
    if(!this.on) return;
    var f=52+ratio*160;
    this.o1.frequency.setTargetAtTime(f, t, 0.05);
    this.o2.frequency.setTargetAtTime(f*1.008+2, t, 0.05);
    this.nGain.gain.setTargetAtTime(drift?0.085:(sand?0.04:0), t, 0.07);
    this.nFlt.frequency.setTargetAtTime(drift?2700:1200, t, 0.09);
  }
};

/* ---------------- 虚拟摇杆（镜头绝对方向） ----------------
   推杆方向 = 镜头（屏幕）方向：往上推车就往上开，往右推车就往右开，
   与车头当前朝向无关（车会自己把车头转向目标方向）。 */
var stick={ active:false, mag:0, dx:0, dy:0, kx:0, ky:0 };
function stickReset(){
  stick.active=false; stick.mag=0; stick.dx=0; stick.dy=0; stick.kx=0; stick.ky=0;
  var s=el('stick'); if(s) s.classList.remove('active');
  var k=el('stickKnob'); if(k) k.style.transform='translate(0px,0px)';
}
(function(){
  var node=el('stick'), knob=el('stickKnob'); if(!node||!knob) return;
  var pid=null, cx=0, cy=0, RAD=40, DEAD=0.15;
  function paint(){
    knob.style.transform='translate('+(stick.kx*RAD).toFixed(1)+'px,'+(stick.ky*RAD).toFixed(1)+'px)';
    node.classList.toggle('active', stick.mag>0.01);
  }
  function track(e){
    var dx=e.clientX-cx, dy=e.clientY-cy, len=Math.hypot(dx,dy);
    var m=Math.min(1, len/RAD);
    var ux = len<0.001? 0 : dx/len, uy = len<0.001? 0 : dy/len;
    stick.kx=ux*m; stick.ky=uy*m;                       /* 摇杆帽视觉位置 */
    stick.mag = m<=DEAD? 0 : Math.min(1,(m-DEAD)/(1-DEAD));   /* 死区后归一化为油门幅度 */
    if(stick.mag>0){ stick.dx=ux; stick.dy=uy; }
    paint();
  }
  node.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try{ node.setPointerCapture(e.pointerId); }catch(err){}
    pid=e.pointerId;
    var r=node.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2; RAD=Math.max(30, r.width*0.28);
    stick.active=true; track(e);
  });
  node.addEventListener('pointermove', function(e){ if(stick.active && e.pointerId===pid) track(e); });
  function end(e){
    if(e && pid!==null && e.pointerId!==pid) return;
    pid=null; stickReset();
  }
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', end);
  node.addEventListener('lostpointercapture', end);
  node.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();

/* 方向驱动：把「镜头绝对方向」的推杆换算成油门/刹车/舵角，车自动把车头转向目标方向 */
function driveByDirection(car, ix, iy, mag){
  var len=Math.hypot(ix,iy);
  if(len<0.06 || mag<=0){ car.input.throttle=0; car.input.brake=0; car.steerTarget=0; return; }
  var ux=ix/len, uy=iy/len;
  var err=angDiff(Math.atan2(uy,ux), car.angle);    /* 目标方向 与 车头方向 的夹角 */
  var ae=Math.abs(err);
  var sp=Math.hypot(car.vx,car.vy);
  car.steerTarget = clamp(err/1.05, -1, 1);
  if(ae<1.30){                      /* 目标在前方：给油，越对齐给得越多 */
    car.input.brake=0;
    car.input.throttle=clamp(mag*(0.55+0.45*Math.cos(err)),0,1);
  }else if(ae<2.35){                /* 目标在侧后方：收油转向 */
    car.input.throttle = sp>70? 0.10 : 0.45;
    car.input.brake = sp>110? 0.55 : 0;
  }else{                            /* 目标在正后方：先刹停，再原地掉头 */
    car.input.throttle = sp>45? 0 : 0.5;
    car.input.brake = sp>45? 1 : 0;
  }
}

/* ---------------- 车辆 ---------------- */
function makeCar(idx, isAI){
  var c = CAR_COLORS[idx];
  return {
    idx:idx, isAI:!!isAI, color:c,
    x:0,y:0,angle:0,vx:0,vy:0,

    finished:false, finishTime:0, rank:1,
    lapStart:0, lapTimes:[], best:null,
    input:{ throttle:0, brake:0, drift:false },

  };

function placeOnGrid(car, s, lat){
  var p=sampleAt(tr, s);
  car.x=p.x+p.nx*lat; car.y=p.y+p.ny*lat;
  car.angle=Math.atan2(p.ty, p.tx);
  car.s=((s%tr.len)+tr.len)%tr.len; car.lastS=car.s; car.fwdRun=0; car.idx=p.idx;
  car.vx=0; car.vy=0; car.steer=0; car.steerTarget=0;
}

/* ---------------- 车辆物理 ---------------- */
function stepCar(car, dt){
  var inp=car.input;
  var cosA=Math.cos(car.angle), sinA=Math.sin(car.angle);
  var vf = car.vx*cosA + car.vy*sinA;
  var vl = -car.vx*sinA + car.vy*cosA;
  var speed=Math.hypot(car.vx,car.vy);
  var ratio=clamp(speed/MAXSPEED,0,1);
  var drift = !!inp.drift && speed>70;
  car.drifting=drift;
  if(drift) car.driftT+=dt; else car.driftT=Math.max(0,car.driftT-dt*2.4);

  var sandMul = car.onSand?0.5:1;      /* 沙地最高速 = 陆地 50% */

  /* 舵角平滑（数字按键 -> 模拟量） */
  var rate = (car.steerTarget===0)?7.6:5.4;
  var ds = car.steerTarget-car.steer;
  car.steer += clamp(ds, -rate*dt, rate*dt);

  /* 纵向 */
  var maxS = MAXSPEED*sandMul*(drift?0.97:1);
  if(inp.throttle>0 && vf<maxS){
    vf += CAR_ACCEL*inp.throttle*(drift?0.76:1)*sandMul*dt;
  }
  if(inp.brake>0) vf -= CAR_BRAKE*inp.brake*sandMul*dt;
  var drag = drift?0.12:0.50;          /* 漂移阻力更小：滑得更远 */
  if(car.onSand) drag = 0.58;          /* 沙地减速温和，主要靠 50% 限速 */
  vf -= vf*drag*dt;
  vf -= (vf>0?1:-1)*Math.min(Math.abs(vf), 26*dt);

  /* 侧向抓地：漂移时摩擦大幅降低（车头已转、车尾仍在滑） */
  var k = drift?0.78:8.6;
  if(car.onSand) k = drift?1.00:4.20;
  vl *= Math.exp(-k*dt);
  if(drift) vf -= Math.min(Math.abs(vl)*0.026, 26)*dt;
  vf = clamp(vf, -170, MAXSPEED*1.02);

  /* 转向 / 甩尾 */
  var fwdDir = (vf<-12)? -1 : 1;
  var eff = clamp(speed/(speed+72),0,1)*(1-0.42*ratio);
  var yaw = car.steer*CAR_YAW*eff*fwdDir;
  if(drift) yaw*=2.0;
  if(Math.abs(vf)<6 && !drift) yaw*=0.35;
  car.angle += yaw*dt;

  car.vx = cosA*vf - sinA*vl;
  car.vy = sinA*vf + cosA*vl;
  car.x += car.vx*dt;
  car.y += car.vy*dt;

  /* 与赛道的相对位置（局部检索：高架上下层不互相吸附） */
  var nt=nearestOnTrack(tr, car.x, car.y, car.idx);
  car.s=nt.s; car.idx=nt.idx;
  var onDeck = inLift(nt.idx);

  if(boundary==='sand' && !onDeck){
    car.onSand = nt.dist > tr.hw;
  }else{
    car.onSand=false;
    var lim = tr.hw-11;
    if(nt.dist>lim){
      var dx=car.x-nt.px, dy=car.y-nt.py, d=Math.hypot(dx,dy)||1;
      var ox=dx/d, oy=dy/d;                   /* 由赛道中心线指向车（即“向外”） */
      var tx=nt.tx, ty=nt.ty;
      var vt = car.vx*tx + car.vy*ty;         /* 沿墙切线分量 */
      var vOut = car.vx*ox + car.vy*oy;       /* 撞墙速度：向外为正 */
      if(vOut<0) vOut=0;
      /* 位置：贴回限位线（保持在同一侧），再向内侧退半个车位 —— 绝不跨到路另一侧 */
      var bump = Math.min(32, 12 + vOut*0.05);   /* 半个车位(约30)的反弹距离 */
      car.x = nt.px + ox*(lim-bump);
      car.y = nt.py + oy*(lim-bump);
      /* 速度：法向按 0.32 反弹回内侧，切线保留 0.82（蹭着墙走） */
      car.vx = -ox*vOut*0.40 + tx*vt*0.80;
      car.vy = -oy*vOut*0.40 + ty*vt*0.80;
      var ta=Math.atan2(nt.ty,nt.tx);
      if(Math.abs(angDiff(ta,car.angle))>Math.PI/2) ta+=Math.PI;
      car.angle += angDiff(ta,car.angle)*0.14;
      if(car.hitCd<=0){
        car.hitCd=0.28;
        cam.shake=Math.min(14, cam.shake+(car===player?9:3));
        spawnBurst(car.x+ox*-14, car.y+oy*-14, '#ffe08a', 8);
        if(car===player){ toast('撞墙！'); }
        if(car===player && Sfx.nGain){ Sfx.nFlt.frequency.value=600; }
      }
    }
  }
  if(car.hitCd>0) car.hitCd-=dt;

  /* 圈数：只有正向（车头方向）跨过起跑线才算一圈，倒车/被撞回不算 */
  var dSlap = car.s - car.lastS;
  if(dSlap >  tr.len/2) dSlap -= tr.len;
  if(dSlap < -tr.len/2) dSlap += tr.len;
  if(dSlap>0) car.fwdRun += dSlap;
  if(dSlap>0 && car.lastS > tr.len-700 && car.s < 700 && car.fwdRun > tr.len*0.55){
    car.fwdRun=0;
    car.lap++;
    onLap(car);
  }
  car.lastS=car.s;

  /* 轮胎印 / 烟尘 */
  var latAbs=Math.abs(vl);
  if(speed>85 && ((drift&&latAbs>42) || (car.onSand&&speed>140) || latAbs>95)){
    emitSkid(car);
  }
}
function onLap(car){
  var lt = raceTime - car.lapStart;
  car.lapStart = raceTime;
  car.lapTimes.push(lt);
  if(car.best==null || lt<car.best){
    car.best=lt;
    if(car===player) toast('最快单圈 '+fmtTime(lt));
  }
  if(car.lap>=totalLaps && !car.finished){
    car.finished=true; car.finishTime=raceTime;
    if(car===player){ finishDelay=1.35; }
  }
}

/* ---------------- 粒子 & 轮胎印 ---------------- */
function emitSkid(car){
  var cosA=Math.cos(car.angle), sinA=Math.sin(car.angle);
  var bx=car.x-cosA*20, by=car.y-sinA*20;
  var nxp=-sinA, nyp=cosA;
  var col = car.onSand? 'rgba(196,168,110,' : 'rgba(48,48,56,';
  for(var sgn=-1;sgn<=1;sgn+=2){
    var wx=bx+nxp*15*sgn, wy=by+nyp*15*sgn;
    skids.push({x:wx,y:wy,a:0.55,col:col});
  }
  if(skids.length>620) skids.splice(0, skids.length-620);
  if(Math.random()<0.55){
    var p=sampleFrom(car, 'smoke');
    parts.push(p);
  }
}
function sampleFrom(car, kind){
  var cosA=Math.cos(car.angle), sinA=Math.sin(car.angle);
  var bx=car.x-cosA*24, by=car.y-sinA*24;
  var sp=Math.hypot(car.vx,car.vy);
  if(kind==='smoke'){
    return { x:bx+(Math.random()-0.5)*26, y:by+(Math.random()-0.5)*26,
      vx:-cosA*sp*0.12+(Math.random()-0.5)*40, vy:-sinA*sp*0.12+(Math.random()-0.5)*40,
      life:0.55+Math.random()*0.4, max:0.95, r:7+Math.random()*7, col:'230,230,225', type:0 };
  }
  return { x:bx, y:by, vx:(Math.random()-0.5)*160, vy:(Math.random()-0.5)*160,
    life:0.4+Math.random()*0.35, max:0.75, r:5+Math.random()*6, col:'214,190,130', type:1 };
}
function spawnBurst(x,y,col,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*TAU, sp=60+Math.random()*180;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.35+Math.random()*0.3, max:0.65, r:3+Math.random()*4, col:'255,224,138', type:1});
  }
  if(parts.length>320) parts.splice(0,parts.length-320);
}

/* ---------------- AI ---------------- */
function aiThink(car, dt){
  var inp=car.input;
  car.noise += dt;
  var vf = car.vx*Math.cos(car.angle)+car.vy*Math.sin(car.angle);
  var sp = Math.abs(vf);
  var look = clamp(sp*0.60, 120, 360);
  var lineOff = car.lineOff + Math.sin(car.noise*0.7+car.idx*0.01)*22;
  var tg = sampleAt(tr, car.s+look, car.idx);
  var tx = tg.x+tg.nx*lineOff, ty = tg.y+tg.ny*lineOff;
  var want = Math.atan2(ty-car.y, tx-car.x);
  var d = angDiff(want, car.angle);
  car.steerTarget = clamp(d*2.5, -1, 1);

  var Rmin=1e6, dd;
  for(dd=0; dd<=420; dd+=60){
    var p=sampleAt(tr, car.s+dd+55, car.idx);
    if(p.R<Rmin) Rmin=p.R;
  }
  var vCap = speedForRadius(Rmin)*car.skill;
  if(vCap>MAXSPEED*car.skill) vCap=MAXSPEED*car.skill;
  if(car.onSand) vCap=MAXSPEED*0.50;

  inp.throttle = (vf < vCap)?1:(vf<vCap*1.06?0.45:0);
  inp.brake = (vf > vCap*1.13)?1:0;
  inp.drift = (Rmin<640 && vf>235 && Math.abs(car.steerTarget)>0.34);
  if(car.onSand) inp.drift=false;
}

/* ---------------- 车车碰撞 ---------------- */
function collideCars(){
  var i,j,L=tr.len;
  for(i=0;i<cars.length;i++){
    for(j=i+1;j<cars.length;j++){
      var a=cars[i], b=cars[j];
      var dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2>115*115) continue;
      /* 高架上下层：空间位置接近但赛道里程相差很远，不参与碰撞 */
      var dsl=Math.abs(a.s-b.s); if(dsl>L/2) dsl=L-dsl;
      if(dsl>L*0.25) continue;
      var d=Math.sqrt(d2)||0.001;
      var ca=Math.cos(a.angle), sa=Math.sin(a.angle);
      var dl= dx*ca+dy*sa;              /* 纵向（沿 a 车头） */
      var dw=-dx*sa+dy*ca;              /* 横向 */
      var penL=40-Math.abs(dl), penW=25-Math.abs(dw);
      if(penL<=0 || penW<=0) continue;
      var ds=b.s-a.s; if(ds>L/2) ds-=L; if(ds<-L/2) ds+=L;
      var front = (ds>0)? b : a;        /* 里程靠前者为前车 */
      var rear  = (ds>0)? a : b;
      var fx=Math.cos(front.angle), fy=Math.sin(front.angle);
      var close = (front.vx-rear.vx)*fx + (front.vy-rear.vy)*fy;   /* <0 = 后车在逼近 */
      if(penW < penL){
        /* 侧面刮擦：横向推开 */
        var nx=-sa, ny=ca;
        if(dw<0){ nx=-nx; ny=-ny; }
        a.x-=nx*penW*0.5; a.y-=ny*penW*0.5;
        b.x+=nx*penW*0.5; b.y+=ny*penW*0.5;
        a.vx*=0.985; a.vy*=0.985; b.vx*=0.985; b.vy*=0.985;
        if((a===player||b===player) && Math.abs(close)>120){
          cam.shake=Math.min(9, cam.shake+3);
          spawnBurst((a.x+b.x)/2,(a.y+b.y)/2,'#ffd166',4);
        }
      }else{
        /* 追尾：后车减速/停下，前车被顶得向前加速 */
        rear.x -= fx*penL*0.80; rear.y -= fy*penL*0.80;
        front.x += fx*penL*0.20; front.y += fy*penL*0.20;
        var hit = Math.max(0, -close);
        var fsp = Math.hypot(front.vx,front.vy);
        var push = Math.min(96, hit*0.55) * clamp(1 - fsp/MAXSPEED, 0, 1);
        front.vx += fx*push; front.vy += fy*push;
        var cut = Math.min(0.86, 0.10 + hit*0.0016);
        rear.vx *= (1-cut); rear.vy *= (1-cut);
        if(hit>260){ rear.vx*=0.25; rear.vy*=0.25; }   /* 高速追尾 -> 几乎停住 */
        if((front===player||rear===player) && hit>90){
          cam.shake=Math.min(10, cam.shake+5);
          spawnBurst((a.x+b.x)/2,(a.y+b.y)/2,'#ffd166',6);
        }
      }
    }
  }
}

/* ---------------- 排名 ---------------- */
function computeRanks(){
  var arr=cars.slice().sort(function(a,b){
    if(a.finished&&b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return (b.lap*tr.len+b.s)-(a.lap*tr.len+a.s);
  });
  for(var i=0;i<arr.length;i++) arr[i].rank=i+1;
  return arr;
}

/* ---------------- 渲染 ---------------- */
function makeSandPattern(){
  var c=document.createElement('canvas'); c.width=140; c.height=140;
  var g=c.getContext('2d');
  g.fillStyle='#e9d8a6'; g.fillRect(0,0,140,140);
  var rnd=mulberry32(20240918);
  for(var i=0;i<160;i++){
    var x=rnd()*140, y=rnd()*140, r=rnd()*1.9+0.5;
    g.fillStyle= rnd()<0.6 ? 'rgba(206,183,124,.55)' : 'rgba(246,236,205,.7)';
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  return ctx.createPattern(c,'repeat');
}
function trackPath(c){
  var A=tr.S;
  c.beginPath();
  for(var i=0;i<A.length;i++){
    if(i===0) c.moveTo(A[i].x,A[i].y); else c.lineTo(A[i].x,A[i].y);
  }
  c.closePath();
}
function drawWorld(){
  var halfW=(VW/2)/viewScale, halfH=(VH/2)/viewScale;
  var vx0=cam.x-halfW-80, vx1=cam.x+halfW+80;
  var vy0=cam.y-halfH-80, vy1=cam.y+halfH+80;

  /* 地面 */
  if(!sandPat) sandPat=makeSandPattern();
  if(sandPat){
    ctx.fillStyle=sandPat;
    ctx.fillRect(vx0,vy0,vx1-vx0,vy1-vy0);
  }else{
    ctx.fillStyle='#e9d8a6';
    ctx.fillRect(vx0,vy0,vx1-vx0,vy1-vy0);
  }

  /* 地面色块 */
  var i,it;
  for(i=0;i<decor.length;i++){
    it=decor[i];
    if(it.type!=='patch') continue;
    if(it.x<vx0-260||it.x>vx1+260||it.y<vy0-260||it.y>vy1+260) continue;
    ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot);
    ctx.fillStyle = it.tone? 'rgba(163,199,120,.5)' : 'rgba(212,190,138,.55)';
    ctx.beginPath(); ctx.ellipse(0,0,it.rx,it.ry,0,0,TAU); ctx.fill();
    ctx.restore();
  }

  ctx.lineJoin='round'; ctx.lineCap='round';

  /* 赛道外圈 */
  trackPath(ctx);
  ctx.strokeStyle='rgba(180,158,108,.55)'; ctx.lineWidth=tr.hw*2+34; ctx.stroke();
  ctx.strokeStyle='#f7f5ee';               ctx.lineWidth=tr.hw*2+16; ctx.stroke();
  trackPath(ctx);
  ctx.save();
  ctx.setLineDash([30,30]);
  ctx.strokeStyle = (boundary==='wall')? '#e8554a' : '#d94436';
  ctx.lineWidth=tr.hw*2+16;
  ctx.lineDashOffset = 0;
  ctx.stroke();
  ctx.restore();
  /* 路面 */
  trackPath(ctx);
  ctx.strokeStyle='#6f7079'; ctx.lineWidth=tr.hw*2; ctx.stroke();
  trackPath(ctx);
  ctx.strokeStyle='#7c7d86'; ctx.lineWidth=tr.hw*2-16; ctx.stroke();
  trackPath(ctx);
  ctx.strokeStyle='rgba(255,255,255,.055)'; ctx.lineWidth=tr.hw*2-30; ctx.stroke();

  /* 墙壁模式：护栏块 */
  if(boundary==='wall'){
    var step=Math.floor(tr.n/ (tr.len/120));
    if(step<1) step=1;
    for(i=0;i<tr.n;i+=step){
      var p=tr.S[i];
      for(var sgn=-1;sgn<=1;sgn+=2){
        var x=p.x+p.nx*(tr.hw+9)*sgn, y=p.y+p.ny*(tr.hw+9)*sgn;
        if(x<vx0-40||x>vx1+40||y<vy0-40||y>vy1+40) continue;
        ctx.save(); ctx.translate(x,y); ctx.rotate(Math.atan2(p.ty,p.tx));
        ctx.fillStyle=(i/step)%2? '#f2f2ee':'#e8554a';
        rr(ctx,-7,-11,14,22,4); ctx.fill();
        ctx.restore();
      }
    }
  }

  /* 起点/终点 格子线 */
  var p0=sampleAt(tr,0);
  ctx.save();
  ctx.translate(p0.x,p0.y); ctx.rotate(Math.atan2(p0.ty,p0.tx));
  var cell=17, cnt=Math.ceil(tr.hw*2/cell);
  for(i=0;i<cnt;i++){
    for(var jj=0;jj<2;jj++){
      ctx.fillStyle=((i+jj)%2)? '#ffffff':'#2b2d36';
      ctx.fillRect(-cell+jj*cell, -tr.hw+i*cell, cell, cell);
    }
  }
  ctx.restore();

  /* 轮胎印 */
  if(skids.length){
    ctx.lineCap='round';
    for(var b=0;b<3;b++){
      var alpha=[0.42,0.26,0.13][b];
      var any=false;
      ctx.beginPath();
      for(i=0;i<skids.length;i++){
        var sk=skids[i];
        var bucket=Math.min(2, (i/skids.length*3)|0);
        if(bucket!==b) continue;
        any=true;
        ctx.moveTo(sk.x,sk.y);
        ctx.lineTo(sk.x+(sk.col.length?0:0), sk.y);
      }
      if(any){ ctx.strokeStyle='rgba(46,46,54,'+alpha+')'; ctx.lineWidth=8; ctx.stroke(); }
    }
  }

  /* 装饰物 */
  for(i=0;i<decor.length;i++){
    it=decor[i];
    if(it.type==='patch') continue;
    if(it.x<vx0-90||it.x>vx1+90||it.y<vy0-90||it.y>vy1+90) continue;
    if(it.type==='palm') drawPalm(ctx,it.x,it.y,it.s,it.rot);
    else drawBush(ctx,it.x,it.y,it.s,it.rot);
  }

  /* 粒子 */
  for(i=0;i<parts.length;i++){
    var pa=parts[i];
    var al=clamp(pa.life/pa.max,0,1);
    ctx.fillStyle='rgba('+pa.col+','+(pa.type===0? al*0.42 : al*0.75)+')';
    ctx.beginPath(); ctx.arc(pa.x,pa.y,pa.r*(pa.type===0?(1.9-al*0.9):al*1.1), 0, TAU); ctx.fill();
  }

  /* 车辆（高架分层：下层 -> 桥面 -> 上层，玩家始终最后画） */
  var ply=-1;
  for(i=0;i<cars.length;i++){ if(cars[i]===player){ ply=i; break; } }
  for(i=0;i<cars.length;i++){ if(i!==ply && !inLift(cars[i].idx)) drawCar(cars[i]); }
  drawLiftDeck();
  for(i=0;i<cars.length;i++){ if(i!==ply && inLift(cars[i].idx)) drawCar(cars[i]); }
  if(ply>=0) drawCar(cars[ply]);
}
function drawCar(car){
  var c=ctx;
  c.save();
  c.translate(car.x,car.y); c.rotate(car.angle);
  /* 影子 */
  c.fillStyle='rgba(20,18,12,.22)';
  rr(c,-30,-16,60,34,13); c.fill();
  c.translate(-2,-3);
  /* 轮胎 */
  c.fillStyle='#26262c';
  rr(c,-23,-22,17,10,4); c.fill();
  rr(c,7,-22,17,10,4);   c.fill();
  rr(c,-23,12,17,10,4);  c.fill();
  rr(c,7,12,17,10,4);    c.fill();
  /* 车身 */
  rr(c,-30,-17,60,34,12);
  c.fillStyle=car.color.body; c.fill();
  /* 车头高光 */
  var gg=c.createLinearGradient(0,-17,0,17);
  gg.addColorStop(0,'rgba(255,255,255,.30)');
  gg.addColorStop(0.45,'rgba(255,255,255,0)');
  gg.addColorStop(1,'rgba(0,0,0,.14)');
  rr(c,-30,-17,60,34,12); c.fillStyle=gg; c.fill();
  /* 车尾扰流 */
  c.fillStyle=car.color.dark;
  rr(c,-33,-18,6,36,3); c.fill();
  /* 座舱 */
  c.fillStyle=car.color.roof;
  rr(c,-14,-12,30,24,9); c.fill();
  /* 风挡 */
  c.fillStyle='#25333f';
  rr(c,6,-10,9,20,3.5); c.fill();
  rr(c,-16,-9,7,18,3.5); c.fill();
  /* 车顶条纹 */
  c.fillStyle='rgba(0,0,0,.10)';
  rr(c,-6,-12,4,24,2); c.fill();
  /* 大灯 */
  c.fillStyle='#fff8d6';
  c.beginPath(); c.arc(28,-10,3.4,0,TAU); c.fill();
  c.beginPath(); c.arc(28,10,3.4,0,TAU); c.fill();
  c.restore();
}
function drawHudCanvas(){
  var w=mmCv.width, h=mmCv.height, pad=30, c=mmCtx;
  c.clearRect(0,0,w,h);
  if(!tr) return;
  c.save();
  c.strokeStyle='rgba(255,255,255,.92)'; c.lineWidth=15; c.lineJoin='round'; c.lineCap='round';
  c.beginPath();
  for(var i=0;i<mmPts.length;i++){
    var q=mmPts[i];
    if(i===0) c.moveTo(q.x,q.y); else c.lineTo(q.x,q.y);
  }
  c.closePath(); c.stroke();
  c.strokeStyle='rgba(120,205,255,.85)'; c.lineWidth=5; c.stroke();
  c.restore();
  for(var j=0;j<cars.length;j++){
    var car=cars[j], p=mmPt(car.x,car.y);
    c.beginPath();
    c.arc(p.x,p.y, car===player?10:8, 0, TAU);
    c.fillStyle = car===player? '#ffffff' : car.color.body;
    c.fill();
    c.lineWidth=3; c.strokeStyle = car===player? '#ff5a45':'rgba(0,0,0,.35)';
    c.stroke();
  }
}
function mmPt(x,y){
  var pad=26, w=mmCv.width, h=mmCv.height, b=mmBox;
  var sx=(w-pad*2)/(b.maxx-b.minx), sy=(h-pad*2)/(b.maxy-b.miny);
  var s=Math.min(sx,sy);
  var ox=(w-(b.maxx-b.minx)*s)/2, oy=(h-(b.maxy-b.miny)*s)/2;
  return { x:ox+(x-b.minx)*s, y:oy+(y-b.miny)*s };
}

/* ---------------- 主循环 ---------------- */
var acc=0, last=0, hudTick=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(dt>0.1) dt=0.1;

  if(state==='paused'||state==='menu'||state==='result'){
    if(state==='paused'||state==='result'||state==='menu'){ Sfx.update(0,false,false,false); }
    return;
  }

  acc+=dt;
  var steps=0;
  while(acc>=1/60 && steps<4){
    update(1/60);
    acc-=1/60; steps++;
  }
  if(steps===0 && acc>0) { /* 保持画面 */ }

  render();
  hudTick+=dt;
  if(hudTick>0.07){ hudTick=0; updateHud(); }
}

function update(dt){
  if(state==='countdown'){
    countdown-=dt;
    var n=Math.ceil(countdown);
    var span=el('countdown').firstElementChild;
    var txt = n>0? String(n) : 'GO!';
    if(span.textContent!==txt){ span.textContent=txt; span.style.animation='none'; void span.offsetWidth; span.style.animation=''; }
    if(countdown<=0){
      state='racing'; raceTime=0;
      for(var k=0;k<cars.length;k++) cars[k].lapStart=0;
      el('countdown').classList.add('hide');
      toast('出发！');
    }
    for(var i=0;i<cars.length;i++){
      var c=cars[i];
      c.input.throttle=0; c.input.brake=0; c.input.drift=false;
      c.steerTarget=0;
    }
    return;
  }
  if(state!=='racing' && state!=='finished') return;

  raceTime+=dt;

  /* 玩家输入 */
  if(!player.finished && !player.isAI){
    /* 输入：优先虚拟摇杆，其次键盘（WASD / 方向键）；两者都按「镜头绝对方向」，
       推哪边车就往哪边走，不随车头朝向变化 */
    if(stick.active && stick.mag>0){
      driveByDirection(player, stick.dx, stick.dy, stick.mag);
    }else{
      var kx=(keys.right?1:0)-(keys.left?1:0), ky=(keys.down?1:0)-(keys.up?1:0);
      driveByDirection(player, kx, ky, (kx||ky)?1:0);
    }
    player.input.drift = keys.drift;
    el('driftBtn').classList.toggle('drifting', player.drifting);
  }

  for(var i=0;i<cars.length;i++){
    var car=cars[i];
    var aiMul = (car.isAI && !car.finished)? (car.spdMul||1) : 1;
    if(aiMul>1.0001){
      /* 难度：其他车辆按倍率整体「快进」。每帧拆成若干子步、每步时长 ×倍率，
         位移与车头转向同步放大 —— 速度变快，但过弯半径与车头转角完全不变。 */
      var subN=Math.ceil(aiMul), subDt=dt*aiMul/subN;
      for(var st=0; st<subN; st++){ aiThink(car, subDt); stepCar(car, subDt); }
    }else{
      if(car.isAI && !car.finished) aiThink(car, dt);
      if(car.finished && car.isAI){
        /* 完赛后自动巡航 */
        aiThink(car, dt);
        car.input.throttle*=0.85;
      }
      stepCar(car, dt);
    }
  }
  collideCars();

  /* 粒子更新 */
  for(var pi=parts.length-1;pi>=0;pi--){
    var p=parts[pi];
    p.life-=dt;
    if(p.life<=0){ parts.splice(pi,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.94; p.vy*=0.94;
  }
  if(skids.length>620) skids.splice(0, skids.length-620);

  /* 镜头 */
  var lead=clamp(Math.hypot(player.vx,player.vy)*0.55, 70, 275);
  var tx=player.x+Math.cos(player.angle)*lead;
  var ty=player.y+Math.sin(player.angle)*lead;
  var kk=1-Math.exp(-7.5*dt);
  cam.x=lerp(cam.x,tx,kk); cam.y=lerp(cam.y,ty,kk);
  var base=viewScale*(1-0.07*clamp(Math.hypot(player.vx,player.vy)/MAXSPEED,0,1));
  cam.scale=lerp(cam.scale, base, 1-Math.exp(-4*dt));

  if(cam.shake>0){
    cam.shake=Math.max(0, cam.shake-dt*26);
    cam.shx=(Math.random()-0.5)*cam.shake/viewScale;
    cam.shy=(Math.random()-0.5)*cam.shake/viewScale;
  }else{ cam.shx=0; cam.shy=0; }

  computeRanks();

  if(finishDelay>0){
    finishDelay-=dt;
    if(finishDelay<=0){ showResult(); }
  }

  Sfx.update(clamp(Math.hypot(player.vx,player.vy)/MAXSPEED,0,1), player.drifting, player.onSand, state==='racing');
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!tr){ ctx.fillStyle='#e9d8a6'; ctx.fillRect(0,0,VW,VH); return; }
  ctx.save();
  /* 镜头：把玩家车在画面中的垂直位置整体上移（对齐手绘"出发"标注高度） */
  ctx.translate(VW/2, VH/2 - VH*0.07);
  ctx.scale(cam.scale,cam.scale);
  ctx.translate(-cam.x+cam.shx, -cam.y+cam.shy);
  drawWorld();
  ctx.restore();
  drawHudCanvas();
}

/* ---------------- HUD ---------------- */
function updateHud(){
  if(!player) return;
  var sp=Math.hypot(player.vx,player.vy);
  el('speedVal').textContent=Math.round(sp*KMH);
  el('timeVal').textContent=fmtTime(state==='countdown'?0:raceTime);
  el('lapNum').textContent=Math.min(player.lap+1, totalLaps);
  el('lapTotal').textContent=totalLaps;
  var rk=player.rank;
  el('rankNum').textContent=rk;
  el('rankSuf').textContent=RANK_SUF[rk-1]||'th';
  var bd=el('rankBadge');
  bd.className='badge'+(rk===1?' mid':(rk>=4?' bad':''));
  var lt=player.lapTimes;
  el('lastLap').textContent = lt.length? ('上圈 '+fmtTime(lt[lt.length-1])) : '上圈 --:--.--';
}
var toastT=0;
function toast(txt){
  var t=el('toast');
  t.textContent=txt; t.style.opacity='1';
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.style.opacity='0'; }, 1100);
}

/* ---------------- 高架桥（8 字交叉分层） ---------------- */
function liftHas(r, idx){
  return (r[0]<=r[1]) ? (idx>=r[0] && idx<=r[1]) : (idx>=r[0] || idx<=r[1]);
}
function inLift(idx){
  if(idx==null || idx<0 || !tr || !tr.lift) return false;
  for(var k=0;k<tr.lift.length;k++){ if(liftHas(tr.lift[k], idx)) return true; }
  return false;
}
function deckPath(a,b){
  var m=tr.n, i=a, guard=0, first=true;
  ctx.beginPath();
  while(guard++ < m+2){
    var q=((i%m)+m)%m;
    var p=tr.S[q];
    if(first){ ctx.moveTo(p.x,p.y); first=false; } else { ctx.lineTo(p.x,p.y); }
    if(q === (((b%m)+m)%m)) break;
    i++;
  }
}
function drawLiftDeck(){
  if(!tr || !tr.lift || !tr.lift.length) return;
  ctx.lineJoin='round'; ctx.lineCap='round';
  for(var k=0;k<tr.lift.length;k++){
    var a=tr.lift[k][0], b=tr.lift[k][1], m=tr.n;
    /* 桥体侧面：把下方路面盖住，形成上下分层 */
    deckPath(a,b); ctx.strokeStyle='#33323a'; ctx.lineWidth=tr.hw*2+48; ctx.stroke();
    deckPath(a,b); ctx.strokeStyle='rgba(0,0,0,.30)'; ctx.lineWidth=tr.hw*2+32; ctx.stroke();
    /* 桥面 */
    deckPath(a,b); ctx.strokeStyle='#94969f'; ctx.lineWidth=tr.hw*2+12; ctx.stroke();
    deckPath(a,b); ctx.strokeStyle='#7f818b'; ctx.lineWidth=tr.hw*2; ctx.stroke();
    deckPath(a,b); ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=tr.hw*2-30; ctx.stroke();
    /* 桥面两侧固定护栏（车不会掉落） */
    var n=(b>=a)? (b-a) : (b-a+m);
    var step=Math.max(1, Math.round(n/20));
    for(var t=0;t<=n;t+=step){
      var p=tr.S[(a+t)%m];
      for(var sgn=-1;sgn<=1;sgn+=2){
        var x=p.x+p.nx*(tr.hw+16)*sgn, y=p.y+p.ny*(tr.hw+16)*sgn;
        ctx.save(); ctx.translate(x,y); ctx.rotate(Math.atan2(p.ty,p.tx));
        ctx.fillStyle=(((t/step)|0)%2)? '#f4f3ee':'#e8554a';
        rr(ctx,-8,-13,16,26,5); ctx.fill();
        ctx.restore();
      }
    }
  }
}

/* ---------------- 流程 ---------------- */
function buildTrackPoints(){
  mmBox=tr.bounds;
  var pad=26, w=mmCv.width, h=mmCv.height, b=mmBox;
  var s=Math.min((w-pad*2)/(b.maxx-b.minx), (h-pad*2)/(b.maxy-b.miny));
  var ox=(w-(b.maxx-b.minx)*s)/2, oy=(h-(b.maxy-b.miny)*s)/2;
  mmPts=[];
  for(var i=0;i<tr.n;i+=2){
    mmPts.push({x:ox+(tr.S[i].x-b.minx)*s, y:oy+(tr.S[i].y-b.miny)*s});
  }
}
function startRace(){
  tr=buildTrack(TRACKS[selTrack]);
  buildTrackPoints();
  decor=genDecor(tr, 9911+selTrack*733);
  skids=[]; parts=[];
  Sfx.init(); Sfx.resume();

  cars=[];
  /* 5 车并排在同一条起跑线上（前后不错位，避免追尾倒退误判圈数） */
  var GRID_S=62, GRID_LAT=56;
  var grid=[
    { s:GRID_S, lat:-GRID_LAT*2, ai:0 },
    { s:GRID_S, lat:-GRID_LAT,   ai:1 },
    { s:GRID_S, lat:0,           ai:2 },
    { s:GRID_S, lat:GRID_LAT,    ai:3 },
    { s:GRID_S, lat:GRID_LAT*2,  ai:4 }
  ];
  var aiIdx=1;
  for(var i=0;i<grid.length;i++){
    var g=grid[i];
    var idx = g.ai? aiIdx++ : 0;
    var car=makeCar(idx, g.ai>0);
    if(g.ai>0){
      car.skill=[0.885,0.915,0.945,0.968][idx-1];
      car.lineOff=[-26, 30, 6, -14][idx-1];
      /* 难度倍率：其他车辆整体快进(位移+转向同步放大)，转弯角度/半径不变 */
      car.spdMul=DIFF_MUL[selDiff-1];
    }
    placeOnGrid(car, g.s, g.lat);
    car.lap=0; car.lastS=((g.s%tr.len)+tr.len)%tr.len;
    cars.push(car);
    if(!car.isAI) player=car;
  }
  /* 起跑前把 s 视作接近一圈末尾 */
  for(var q=0;q<cars.length;q++){
    cars[q].s = cars[q].lastS;
  }

  cam.x=player.x; cam.y=player.y; cam.scale=viewScale;
  cam.shake=0; cam.shx=0; cam.shy=0;
  raceTime=0; countdown=3.6; finishDelay=0;
  computeRanks();
  state='countdown';
  el('countdown').classList.remove('hide');
  el('countdown').firstElementChild.textContent='3';
  el('menu').classList.add('hide');
  el('result').classList.add('hide');
  el('pause').classList.add('hide');
  clearKeys();
  updateHud();
  last=0;
}
function togglePause(){
  if(state==='paused'){ resumeRace(); return; }
  if(state!=='racing'&&state!=='countdown') return;
  state='paused';
  el('pause').classList.remove('hide');
  clearKeys();
}
function resumeRace(){
  if(state!=='paused') return;
  el('pause').classList.add('hide');
  state = (countdown>0)? 'countdown':'racing';
  last=0;
}
function quitToMenu(){
  state='menu';
  el('pause').classList.add('hide');
  el('result').classList.add('hide');
  el('menu').classList.remove('hide');
  el('countdown').classList.add('hide');
  clearKeys();
  Sfx.update(0,false,false,false);
}
function showResult(){
  state='result';
  var order=computeRanks();
  var rk=player.rank;
  el('resRank').textContent=rk+(RANK_SUF[rk-1]||'th');
  el('resSub').textContent= rk===1? '冠军！完美驾驶' : (rk<=3? '登上领奖台':'继续努力，再快一点');
  el('resTime').textContent=fmtTime(player.finishTime||raceTime);
  var list=el('resList'); list.innerHTML='';
  for(var i=0;i<order.length;i++){
    var c=order[i];
    var d=document.createElement('div');
    d.className='row'+(c===player?' me':'');
    var t = c.finished? fmtTime(c.finishTime) : ('第'+Math.min(c.lap+1,totalLaps)+'圈');
    d.innerHTML='<div class="pos">'+(i+1)+'</div>'+
      '<div class="dot" style="background:'+c.color.body+'"></div>'+
      '<div class="nm">'+c.name+'</div><div class="tm">'+t+'</div>';
    list.appendChild(d);
  }
  var ll=el('lapList'); ll.innerHTML='';
  var best=player.best;
  for(var k=0;k<player.lapTimes.length;k++){
    var row=document.createElement('div');
    row.className='laprow'+(player.lapTimes[k]===best?' best':'');
    row.innerHTML='<span>第 '+(k+1)+' 圈</span><span>'+fmtTime(player.lapTimes[k])+(player.lapTimes[k]===best?' ★':'')+'</span>';
    ll.appendChild(row);
  }
  if(!player.lapTimes.length){ ll.innerHTML='<div class="laprow"><span>未完成任何一圈</span><span>--</span></div>'; }
  saveBest();
  el('result').classList.remove('hide');
  Sfx.update(0,false,false,false);
}

/* ---------------- 最佳成绩存档 ---------------- */
function saveBest(){
  if(player.best==null) return;
  try{
    var raw=localStorage.getItem('marvis-race-best');
    var data={};
    if(raw){ try{ data=JSON.parse(raw)||{}; }catch(e){ data={}; } }
    if(!data || typeof data!=='object') data={};
    var key='t'+selTrack;
    var old=data[key];
    if(old==null || player.best<old){ data[key]=player.best; }
    localStorage.setItem('marvis-race-best', JSON.stringify(data));
  }catch(e){}
}
function loadBest(i){
  try{
    var raw=localStorage.getItem('marvis-race-best');
    if(!raw) return null;
    var d=JSON.parse(raw);
    if(!d||typeof d!=='object') return null;
    var v=d['t'+i];
    return (typeof v==='number'&&isFinite(v))? v : null;
  }catch(e){ return null; }
}

/* ---------------- 菜单构建 ---------------- */
function starStr(n){ var s=''; for(var i=0;i<5;i++) s+= i<n? '★':'☆'; return s; }
function buildMenu(){
  var box=el('trackList'); box.innerHTML='';
  for(var i=0;i<TRACKS.length;i++){
    var t=TRACKS[i];
    var tmp=buildTrack(t);
    var lenM=Math.round(tmp.len/UNIT_M);
    var turns=countTurns(tmp);
    var best=loadBest(i);
    var d=document.createElement('div');
    d.className='tcard'+(i===selTrack?' sel':'');
    d.setAttribute('data-i', i);
    d.innerHTML='<div class="tnum">'+(i+1)+'</div>'+
      '<div class="tinfo"><div class="tname">'+t.name+'</div>'+
      '<div class="tmeta">长度 '+lenM+' m · '+turns+' 个弯 · 路面 '+(t.hw*2/10).toFixed(0)+' m'+
      (best!=null? ' · 最佳 '+fmtTime(best):'')+'</div></div>'+
      '<div class="tstars">'+starStr(t.diff)+'</div>';
    d.addEventListener('click', function(e){
      selTrack=parseInt(this.getAttribute('data-i'),10);
      buildMenu();
    });
    box.appendChild(d);
  }
  el('lapTotal').textContent=totalLaps;
}
function countTurns(tmp){
  var cnt=0, i=0, A=tmp.S, m=tmp.n;
  while(i<m){
    var p=A[i], pr=A[(i-1+m)%m], nx=A[(i+1)%m];
    if(p.R<900 && p.R<=pr.R && p.R<=nx.R){ cnt++; i+=30; } else i++;
  }
  return cnt;
}

/* ---------------- 绑定 UI ---------------- */
Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function(b){
  b.addEventListener('click', function(){
    boundary=this.getAttribute('data-mode');
    Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function(x){ x.classList.remove('on'); });
    this.classList.add('on');
    el('modeSeg').querySelectorAll('button');
  });
});
Array.prototype.forEach.call(document.querySelectorAll('#lapSeg button'), function(b){
  b.addEventListener('click', function(){
    totalLaps=parseInt(this.getAttribute('data-laps'),10);
    Array.prototype.forEach.call(document.querySelectorAll('#lapSeg button'), function(x){ x.classList.remove('on'); });
    this.classList.add('on');
    el('lapTotal').textContent=totalLaps;
  });
});
/* 难度选择（主菜单）——只改其他车辆车速 */
function applyDiff(n){
  if(n<1||n>6) n=1;
  selDiff=n;
  el('diffLabel').textContent=DIFF_NAME[n-1]+' · 对手车速 '+Math.round(DIFF_MUL[n-1]*100)+'%';
}
Array.prototype.forEach.call(document.querySelectorAll('#diffSeg button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#diffSeg button'), function(x){ x.classList.remove('on'); });
    this.classList.add('on');
    applyDiff(parseInt(this.getAttribute('data-diff'),10));
  });
});
applyDiff(selDiff);
el('startBtn').addEventListener('click', function(){ Sfx.init(); Sfx.resume(); startRace(); });
el('againBtn').addEventListener('click', function(){ startRace(); });
el('backBtn').addEventListener('click', function(){ quitToMenu(); });
el('resumeBtn').addEventListener('click', function(){ resumeRace(); });
el('restartBtn').addEventListener('click', function(){ startRace(); });
el('quitBtn').addEventListener('click', function(){ quitToMenu(); });
el('pauseBtn').addEventListener('click', function(e){ e.preventDefault(); togglePause(); });
el('soundBtn').addEventListener('click', function(e){
  e.preventDefault();
  Sfx.on=!Sfx.on;
  this.classList.toggle('on', Sfx.on);
  this.textContent = Sfx.on? '♪':'✕';
  if(Sfx.on){ Sfx.init(); Sfx.resume(); }
  else if(Sfx.ready){ try{ Sfx.master.gain.setTargetAtTime(0, Sfx.ac.currentTime, 0.05); }catch(err){} }
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden && (state==='racing'||state==='countdown')) togglePause();
});
window.addEventListener('blur', function(){
  if(state==='racing'||state==='countdown') togglePause();
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});

/* ---------------- 启动 ---------------- */
resize();
buildMenu();
el('soundBtn').classList.add('on');
(function boot(){
  /* 菜单背景：先建好第一条赛道的静态场景，避免黑屏 */
  tr=buildTrack(TRACKS[0]);
  buildTrackPoints();
  decor=genDecor(tr, 4242);
  player=makeCar(0,false);
  cars=[player];
  placeOnGrid(player, -200, 0);
  cam.x=player.x; cam.y=player.y;
  var p2=computeRanks0();
  state='menu';
})();
function computeRanks0(){ return 0; }
requestAnimationFrame(loop);
resize();
})();
</script>
